[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["path_security"]

[tool.setuptools.package-data]
"frontends.tui" = ["*.tcss"]
"frontends.observe" = ["static/*", "static/panels/*"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "approval*",
    "artifacts*",
    "context*",
    "frontends*",
    "llm*",
    "memory*",
    "migrations*",
    "runtime*",
    "schedules*",
    "scripts*",
    "reins_secrets*",
    "skills*",
    "tasks*",
    "tools*",
    "triggers*",
]
namespaces = false

[project]
name = "reins-agent"
version = "0.1.0"
description = "Reins local-first agent harness runtime."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.122.0,<1",
    "croniter>=6.2,<7",
    "jsonschema>=4.25,<5",
    "referencing>=0.30,<1",
    "keyboard>=0.13",
    "openai>=3.2.0,<4",
    "pyyaml>=6.0",
    "pywin32>=306; platform_system == 'Windows'",
    "rich>=14.2,<15",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
vision = [
    "mss>=9.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
]
os = [
    "pyperclip>=1.8",
]
mcp = [
    "mcp>=1.26.0,<2",
    "httpx>=0.28.1,<1",
]
tui = [
    "Pillow>=10.0",
    "prompt-toolkit>=3.0",
    "pypdf>=6.9.1",
    "textual>=8.2.8,<9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-pywin32>=306; platform_system == 'Windows'",
    "vcrpy>=6.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
reins-tui = "frontends.tui.main:main"

# 保持原有代码检查范围，避免工具升级改变发布门槛
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
