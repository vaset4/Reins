servers:
  filesystem:
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "~/.reins/data"]
    transport: stdio
    env: {}
    tool_risk_overrides:
      read_file: confirm
      write_file: confirm
      delete_file: deny
  time:
    command: ["npx", "-y", "@modelcontextprotocol/server-time"]
    transport: stdio
    env: {}
    tool_risk_overrides: {}
